<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="370" viewBox="0 0 1120 370" role="img" aria-labelledby="title desc">
<title id="title">Memoraio — do conteúdo disperso à memória organizada</title><desc id="desc">Ilustração conceitual, sem dados reais. Três etapas: escolher fontes, acompanhar a fila e consultar uma biblioteca organizada por mês.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#141927"/><stop offset="1" stop-color="#24243c"/></linearGradient></defs>
<rect width="1120" height="370" rx="22" fill="url(#bg)"/>
<rect x="36" y="38" width="44" height="44" rx="12" fill="#8b82ff"/><path d="m48 60 10-10 10 10-10 10z" fill="none" stroke="white" stroke-width="3"/>
<text x="96" y="70" font-family="Arial,sans-serif" font-weight="700" font-size="31" fill="#fff">Memoraio</text>
<text x="38" y="118" font-family="Arial,sans-serif" font-size="22" fill="#dee2ee">Conteúdo que você acompanha. Conhecimento que você encontra.</text>
<g font-family="Arial,sans-serif"><rect x="38" y="154" width="322" height="163" rx="15" fill="#252d40" stroke="#3b4965"/><text x="60" y="187" font-size="13" fill="#9bc7ff">01 · ESCOLHER</text><text x="60" y="219" font-size="21" fill="#fff">Suas fontes, seu controle</text><text x="60" y="248" font-size="15" fill="#bdc7da">Adicione um canal e consulte novidades.</text><text x="60" y="276" font-size="15" fill="#bdc7da">Você decide quando começar.</text>
<rect x="399" y="154" width="322" height="163" rx="15" fill="#252d40" stroke="#3b4965"/><text x="421" y="187" font-size="13" fill="#ffd18d">02 · ACOMPANHAR</text><text x="421" y="219" font-size="21" fill="#fff">Uma fila que faz sentido</text><text x="421" y="248" font-size="15" fill="#bdc7da">Em andamento, aguardando e pausados.</text><rect x="421" y="270" width="275" height="7" rx="3.5" fill="#414a61"/><rect x="421" y="270" width="185" height="7" rx="3.5" fill="#e9b65d"/>
<rect x="760" y="154" width="322" height="163" rx="15" fill="#252d40" stroke="#3b4965"/><text x="782" y="187" font-size="13" fill="#c7b0ff">03 · CONSULTAR</text><text x="782" y="219" font-size="21" fill="#fff">Um acervo que permanece</text><text x="782" y="248" font-size="15" fill="#bdc7da">TXT por canal e mês. MP3 ou MP4.</text><text x="782" y="276" font-size="15" fill="#bdc7da">Saiba o que já foi guardado.</text>
<text x="40" y="346" font-size="12" fill="#a8b4ce">ILUSTRAÇÃO CONCEITUAL · SEM CANAIS, ARQUIVOS OU ESTATÍSTICAS REAIS</text></g></svg>