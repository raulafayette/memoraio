name: Validate source and build macOS shell
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Publication privacy gate
        run: python scripts/audit_public.py . --tracked --history
      - name: Native prerequisites
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: brew install ffmpeg node
      - name: Isolated pinned dependencies
        run: |
          python -m venv .service-venv
          .service-venv/bin/python -m pip install --no-cache-dir -r requirements-v2.lock.txt -r requirements-licensing.lock.txt -r requirements-dev.lock.txt
      - name: Tests and source quality
        run: |
          export PATH="$GITHUB_WORKSPACE/.service-venv/bin:$PATH"
          .service-venv/bin/python -m compileall -q memoria licensing
          node --check memoria/static/app.js
          .service-venv/bin/ruff check memoria licensing macos scripts tests
          .service-venv/bin/python -m unittest discover -s tests -v
      - name: Public source audit
        run: python scripts/audit_public.py . --tracked --history
      - name: Build native shell
        run: |
          python macos/build.py
          codesign --verify --deep --strict Memoraio.app
          ditto -c -k --sequesterRsrc --keepParent Memoraio.app Memoraio-macos-arm64.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Memoraio-macos-arm64-development
          path: Memoraio-macos-arm64.zip
          retention-days: 7
  windows-engine-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Publication privacy gate
        run: python scripts/audit_public.py . --tracked --history
      - name: Linux prerequisites
        run: sudo apt-get update && sudo apt-get install -y zsh ffmpeg
      - name: Caption and download dependencies only
        run: python -m pip install -r requirements-acquisition.txt -r requirements-licensing.lock.txt -r requirements-dev.lock.txt
      - name: WSL engine and installer checks
        run: |
          bash -n windows/install-wsl.sh
          python -m compileall -q memoria windows scripts
          python -m unittest discover -s tests -q
      - name: Build Windows WSL source preview
        run: git archive --format=zip --output=Memoraio-windows-wsl-preview.zip HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Memoraio-windows-wsl-preview
          path: Memoraio-windows-wsl-preview.zip
          retention-days: 7
