name: Melhoria / Feature proposal
description: Proponha uma melhoria com um caso de uso claro / Suggest a scoped improvement.
body:
  - type: textarea
    id: problem
    attributes:
      label: Problema e resultado desejado / Problem and expected result
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Limites e forma de testar / Constraints and verification
      description: "Explique como testar com dados fictícios, preservando o acervo. / Use synthetic data and preserve existing files."
