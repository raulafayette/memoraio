name: Problema / Bug report
description: Relate um problema reproduzível com dados fictícios / Report a reproducible bug.
body:
  - type: markdown
    attributes:
      value: "Não anexe acervo, canais pessoais, transcrições reais, cookies, tokens ou caminhos pessoais. Use exemplos fictícios. / Use synthetic data only."
  - type: textarea
    id: behavior
    attributes:
      label: Comportamento esperado e observado / Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Passos e ambiente / Steps and environment
      description: "Sistema, versão e exemplo fictício. / OS, version and synthetic example."
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Diagnóstico revisado / Sanitized diagnostics
